<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yu Gi Uai Oh</title>
<meta name="description" content="Yu Gi Uai Oh — em construção.">
<style>
  :root {
    --fundo: #0d0a14;
    --fundo-carta: #171122;
    --borda: #3d2f55;
    --ouro: #e8c15a;
    --roxo: #8b5cf6;
    --texto: #e6e0f0;
    --apagado: #9287a8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(ellipse at 50% -20%, #2a1f42 0%, transparent 60%),
      var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }

  .carta {
    width: 100%;
    max-width: 520px;
    padding: 48px 36px;
    text-align: center;
    background: var(--fundo-carta);
    border: 1px solid var(--borda);
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
  }

  .selo {
    width: 68px;
    height: 68px;
    margin: 0 auto 28px;
    display: grid;
    place-items: center;
    font-size: 30px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--ouro), #b8912f);
    color: #1a1226;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 7vw, 40px);
    letter-spacing: .02em;
    color: var(--ouro);
  }

  .sub {
    margin: 0 0 32px;
    color: var(--apagado);
    font-size: 15px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 18px;
    font-size: 13px;
    border: 1px solid var(--borda);
    border-radius: 999px;
    color: var(--apagado);
  }

  .ponto {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--roxo);
    animation: pulsar 2s ease-in-out infinite;
  }

  @keyframes pulsar {
    0%, 100% { opacity: 1; }
    50%      { opacity: .3; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ponto { animation: none; }
  }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: #5f5675;
  }
</style>
</head>
<body>
  <main class="carta">
    <div class="selo" aria-hidden="true">★</div>
    <h1>Yu Gi Uai Oh</h1>
    <p class="sub">Yigioh online</p>
    <p class="status"><span class="ponto" aria-hidden="true"></span> Site em construção</p>
    <footer>yugiuaioh.com.br</footer>
  </main>
</body>
</html>
